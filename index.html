<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustoz Pro | Platforma v18.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { 
            --primary: #6366f1; --secondary: #f43f5e; --success: #10b981; 
            --bg: #f8fafc; --text: #1e293b; --wrong: #ef4444;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 850px; margin: auto; }

        .glass-card { 
            background: white; border-radius: 24px; padding: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        /* Test Elementlari */
        #timer { 
            font-size: 30px; font-weight: 800; color: var(--secondary); 
            text-align: center; position: sticky; top: 10px; z-index: 1000;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
            border-radius: 15px; padding: 10px; margin-bottom: 20px;
            border: 2px solid #e2e8f0;
        }

        .q-card { 
            background: white; padding: 20px; border-radius: 18px; 
            border: 1px solid #e2e8f0; margin-bottom: 20px; 
        }

        .option-label { 
            display: flex; align-items: center; padding: 14px; 
            background: #f1f5f9; border-radius: 12px; margin: 10px 0; 
            cursor: pointer; transition: 0.2s; border: 2px solid transparent;
        }

        .option-label:hover { background: #e2e8f0; }
        .option-label input { width: 20px; height: 20px; margin-right: 12px; accent-color: var(--primary); }

        /* Tugmalar */
        .btn { 
            background: var(--primary); color: white; border: none; padding: 16px; 
            border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; 
            font-size: 16px; transition: 0.3s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 2px solid #e2e8f0; color: #64748b; margin-top: 10px; }

        /* Xatolar tahlili stili */
        .review-card { border-left: 5px solid #cbd5e1; padding-left: 15px; }
        .review-correct { border-left-color: var(--success); background: #f0fdf4; }
        .review-wrong { border-left-color: var(--wrong); background: #fef2f2; }

        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen" class="glass-card">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 5px;">Ustoz Pro</h1>
        <p style="text-align:center; color:#64748b; margin-bottom:30px;">Zamaxshariy izdoshlari xususiy maktabi</p>
        
        <select id="sClass" onchange="updateData()" style="width:100%; padding:15px; border-radius:12px; margin-bottom:10px;">
            <option value="">-- Sinfni tanlang --</option>
            <option value="5-sinf">5-sinf</option>
            <option value="6-sinf">6-sinf</option>
            <option value="7-sinf">7-sinf</option>
            <option value="8-sinf">8-sinf</option>
        </select>
        <select id="sName" style="width:100%; padding:15px; border-radius:12px; margin-bottom:10px;"><option value="">-- O'quvchi --</option></select>
        <select id="sSub" style="width:100%; padding:15px; border-radius:12px; margin-bottom:10px;"><option value="">-- Fan --</option></select>
        
        <button class="btn" onclick="startTest()">Testni Boshlash</button>
        <button class="btn btn-outline" onclick="showAdmin()">Admin Panel</button>
    </div>

    <div id="test-screen" class="hidden">
        <div id="timer">00:00</div>
        <div id="questions-area"></div>
        <button class="btn" style="background:var(--success)" onclick="finishTest()">Testni Yakunlash</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="glass-card" style="text-align:center">
            <h2 id="res-name"></h2>
            <div id="res-score" style="font-size: 60px; font-weight: 900; color: var(--primary);">0/0</div>
            <p id="res-percent" style="font-weight: 800;"></p>
            <button class="btn" onclick="location.reload()">Chiqish</button>
        </div>

        <div id="review-area" class="glass-card">
            <h3 style="margin-top:0">Xatolar ustida ishlash:</h3>
            <div id="review-list"></div>
        </div>
    </div>

    <div id="admin-panel" class="hidden glass-card">
        <h3>Admin boshqaruvi</h3>
        <button class="btn" onclick="syncData()">Google Sheets'dan yuklash</button>
        <div id="results-table" style="margin-top:20px; overflow-x:auto;">
            <table>
                <thead><tr><th>Ism</th><th>Ball</th><th>Sana</th></tr></thead>
                <tbody id="admin-res-body"></tbody>
            </table>
        </div>
        <button class="btn btn-outline" onclick="location.reload()">Orqaga</button>
    </div>
</div>

<script>
    // Sozlamalar
    const TG_TOKEN = "1236509656:AAH8lsLDpQ-4r5f2ZuHXxVEigrfMqdlbz9g";
    const TG_CHAT_ID = "727716224";
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT80cxkCgcYdA0OqUOTkrLHeq-wp5MU29ullRUnuTX8L5IM3F3GIxdLtgbJxFrt18unljnQgdaoyarJ/pub?output=csv";

    let db = JSON.parse(localStorage.getItem('ustoz_pro_db')) || { questions: {}, results: [] };
    let currentQuestions = [];
    let testStartTime;
    let cheatCount = 0;

    // 1. Ma'lumotlarni yangilash
    function updateData() {
        const cls = document.getElementById('sClass').value;
        const sn = document.getElementById('sName'), ss = document.getElementById('sSub');
        sn.innerHTML = '<option value="">-- O\'quvchi --</option>';
        ss.innerHTML = '<option value="">-- Fan --</option>';
        
        const students = {
            "5-sinf": ["Yo‘ldoshaliyev Abdulahad", "Nabijonova Sitora", "Abdumutaliyeva Asalxon", "Usmonxo‘jayeva Diyoraxon", "Bekmirzayev Otabek", "Hakimjonov Hamidullo", "Rustamova Malikaxon", "Usmonaliyev Alisher", "Musajonov Hojimurod", "Alijonov Islombek", "Imomova Xushnoza", "Nu‘monova Madina", "Sobirov Muhammadbobur", "Zuxriddinova Yasminaxon", "Inomjonov Ibrohim", "Bannonov Abdulloh", "Saidmo'minova Muhsinaxon", "Muhammadolimov Fahriddin", "Odiljonova Muslimaxon"],
            "6-sinf": ["Nosirjonova Layloxon", "Muhammadaliyeva Sevaraxon", "Mamasoliyeva Hadicha", "To‘lqinjonova Shahzoda", "Mamasoliyeva Mubina", "Qo‘shoqboyev Muhammadaziz", "Mansurjonov Hojakbar", "Soliyev Shamsiddin", "G‘ulomjonov Muhammaddiyor", "Soliyev Ziyovuddin", "Rustamjonova Rayxona", "Alijonov Anasxon", "Yusufjonova Fotimaxon", "Mamadnosirov G'olibjon", "Odiljonova Salomatxon", "Abdulazizova Nozimaxon"],
            "7-sinf": ["Yo'ldoshaliyeva Farzona", "Abdullayev Muslimbek", "Adhamov Jahongir", "Muxtorov Abdulloh", "Adhamjonov Muhammadyusuf", "Ergashboyev Abdulloh", "Abdumutalov Abdulbosit", "Akramjonov Murodillo", "Ashuraliyev Ilhomjon", "Omonaliyev Muhammad", "Bahodirov Saidabror", "Alijonov Mus'ab", "Kamoliddinov Shamshodbek", "Bahriddinov Muhammadjon", "Nuraliyev Muhammadyasin", "Xoshimjonov Dovudbek", "Ibrohimov Islomjon"],
            "8-sinf": ["Rustamova Mushtariy", "Usmonaliyev Sanjarbek", "Zokirjonova Zahroxon", "Nurmatova Mohinabonu", "Mamasoliyeva Arofatxon", "Mirzajonov Fayzulloh", "Zafarjonov Behruzbek", "Oʻlmasova Mohichehra", "Valijonova Zeboxon", "Lazizxonova Oyshabonu", "Tursunov Aliy", "Qodirov Bobomurod", "Inomjonova Umidaxon", "Ortiqboyeva Malikaxon", "Adhamjonov Muhammadsaid", "Qodirova Sarvinoz", "Abdulazizov Mashrabbek"]
        };
        const subjects = ["Tarix", "Turk tili", "Geografiya"];

        if(cls && students[cls]) {
            students[cls].forEach(s => sn.innerHTML += `<option value="${s}">${s}</option>`);
            subjects.forEach(sub => ss.innerHTML += `<option value="${sub}">${sub}</option>`);
        }
    }

    // 2. Testni boshlash
    function startTest() {
        const cls = document.getElementById('sClass').value;
        const sub = document.getElementById('sSub').value;
        const name = document.getElementById('sName').value;

        if(!db.questions[cls] || !db.questions[cls][sub]) return alert("Bu fan uchun testlar yuklanmagan!");

        currentQuestions = [...db.questions[cls][sub].qs].sort(() => 0.5 - Math.random()).slice(0, 15);
        
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('test-screen').classList.remove('hidden');

        renderQuestions();
        startTimer(20 * 60);
        testStartTime = new Date();
        
        // Anti-Cheat yoqish
        window.onblur = () => {
            cheatCount++;
            alert("Diqqat! Sahifadan chiqish mumkin emas. Ogohlantirish: " + cheatCount);
        };
    }

    function renderQuestions() {
        const area = document.getElementById('questions-area');
        area.innerHTML = currentQuestions.map((q, i) => `
            <div class="q-card">
                <p><b>${i+1}. ${q.q}</b></p>
                ${['a','b','c','d'].map(opt => `
                    <label class="option-label">
                        <input type="radio" name="q${i}" value="${opt}"> ${q[opt]}
                    </label>
                `).join('')}
            </div>
        `).join('');
    }

    // 3. Testni yakunlash
    async function finishTest() {
        if(!confirm("Testni yakunlaysizmi?")) return;
        window.onblur = null;

        let score = 0;
        const reviewList = [];

        currentQuestions.forEach((q, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`)?.value;
            const correct = q.cr.toLowerCase();
            if(selected === correct) score++;
            
            reviewList.push({
                q: q.q,
                selected: selected ? q[selected] : "Belgilanmagan",
                correct: q[correct],
                isRight: selected === correct
            });
        });

        const percent = Math.round((score / currentQuestions.length) * 100);
        showResults(score, percent, reviewList);
        sendTelegram(score, percent);
    }

    function showResults(score, percent, reviewList) {
        document.getElementById('test-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-name').innerText = document.getElementById('sName').value;
        document.getElementById('res-score').innerText = `${score}/${currentQuestions.length}`;
        document.getElementById('res-percent').innerText = `O'zlashtirish: ${percent}%`;

        const listArea = document.getElementById('review-list');
        listArea.innerHTML = reviewList.map((r, i) => `
            <div class="q-card review-card ${r.isRight ? 'review-correct' : 'review-wrong'}">
                <p><b>${i+1}. ${r.q}</b></p>
                <p>Sizning javobingiz: <span style="color:${r.isRight?'green':'red'}">${r.selected}</span></p>
                ${!r.isRight ? `<p style="color:var(--primary)">To'g'ri javob: ${r.correct}</p>` : ''}
            </div>
        `).join('');
    }

    // 4. Telegramga tahliliy xabar
    function sendTelegram(score, percent) {
        const name = document.getElementById('sName').value;
        const cls = document.getElementById('sClass').value;
        const sub = document.getElementById('sSub').value;
        
        const text = `📊 *TEST NATIJASI (v18.0)*\n\n` +
                     `👤 *O'quvchi:* ${name}\n` +
                     `🏫 *Sinf:* ${cls}\n` +
                     `📚 *Fan:* ${sub}\n` +
                     `✅ *To'g'ri:* ${score} ta\n` +
                     `📈 *Foiz:* ${percent}%\n` +
                     `⚠️ *Chetlanish:* ${cheatCount} marta\n` +
                     `🕒 *Sana:* ${new Date().toLocaleString()}`;

        fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: TG_CHAT_ID, text: text, parse_mode: 'Markdown' })
        });
    }

    // Yordamchi funksiyalar
    function startTimer(duration) {
        let t = duration;
        const timerEl = document.getElementById('timer');
        const interval = setInterval(() => {
            let m = Math.floor(t / 60), s = t % 60;
            timerEl.innerText = `${m}:${s < 10 ? '0' + s : s}`;
            if (--t < 0) { clearInterval(interval); finishTest(); }
        }, 1000);
    }

    async function syncData() {
        try {
            const res = await fetch(SHEET_URL);
            const csv = await res.text();
            const lines = csv.split('\n').slice(1);
            db.questions = {};
            lines.forEach(line => {
                const [sinf, fan, q, a, b, c, d, cr] = line.split(',').map(x => x?.trim());
                if(!db.questions[sinf]) db.questions[sinf] = {};
                if(!db.questions[sinf][fan]) db.questions[sinf][fan] = { qs: [] };
                db.questions[sinf][fan].qs.push({q, a, b, c, d, cr});
            });
            localStorage.setItem('ustoz_pro_db', JSON.stringify(db));
            alert("Ma'lumotlar muvaffaqiyatli yangilandi!");
        } catch(e) { alert("Xatolik yuz berdi!"); }
    }

    function showAdmin() {
        const pass = prompt("Admin parolini kiriting:");
        if(pass === "admin123") {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
